<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Корпоративный чат</title><script defer="defer" src="bundle.js"></script></head><body><div class="modal-window" id="modal-window"><div class="modal-content"><h2>Добро пожаловать</h2><p class="welcome-text">Выберите никнейм для входа в корпоративный чат</p><input class="text-input" id="nickname-input" placeholder="Придумайте имя..." autocomplete="off" required> <button class="action-btn" id="register-btn">Войти в чат</button><div class="error" id="error-msg"></div></div></div><div class="chat-layout" id="chat-container" style="display: none;"><aside class="sidebar"><div class="sidebar-header"><h3>Участники</h3><span class="badge" id="online-count">0</span></div><ul class="user-list" id="user-list"></ul></aside><main class="main-chat"><div class="messages-container" id="messages-container"><div class="empty-state">Начните общение</div></div><div class="input-area"><input id="message-input" placeholder="Напишите сообщение..." disabled="disabled"> <button class="send-btn" id="send-btn" disabled="disabled">➤</button></div></main></div></body></html>
